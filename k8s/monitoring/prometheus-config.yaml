apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      # How often to collect metrics from every target
      scrape_interval: 15s

    scrape_configs:
      # Prometheus scrapes its own /metrics
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # The Flask app: discover every pod, scrape each one separately
      - job_name: mini-devops-lab
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ["mini-lab"]   # matches the Role we created
        relabel_configs:
          # Keep only pods labeled app=mini-devops-lab
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: mini-devops-lab
            action: keep
          # Keep only the app port (5000)
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "5000"
            action: keep
          # Expose the pod name as a normal label
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          # Expose the namespace as a normal label
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
