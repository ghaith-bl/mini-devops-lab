apiVersion: v1
kind: Service
metadata:
  name: mini-devops-lab
  namespace: mini-lab
spec:
  # Internal-only service, reachable from inside the cluster
  type: ClusterIP
  # Send traffic to every ready pod with this label
  selector:
    app: mini-devops-lab
  ports:
    - port: 80
      targetPort: 5000
